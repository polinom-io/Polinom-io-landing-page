name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate HTML and locale files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTML validator
        run: pip install html5validator

      - name: Validate index.html against the HTML5 spec
        run: html5validator --root . --match "index.html"

      - name: Check locale files are valid JSON and in sync
        run: python3 scripts/check_locales.py

      - name: Check data-i18n keys match locales/en.json
        run: python3 scripts/check_i18n_keys.py
