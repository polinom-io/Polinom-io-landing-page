name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate types, locale files, build, and HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Type-check Astro/TypeScript files
        run: npm run check

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check locale files are valid JSON and in sync
        run: python3 scripts/check_locales.py

      - name: Check t() keys match src/i18n/en.json
        run: python3 scripts/check_i18n_keys.py

      - name: Build the site
        run: npm run build

      - name: Install HTML validator
        run: pip install html5validator

      - name: Validate built HTML against the HTML5 spec
        run: html5validator --root dist --match "*.html"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload build as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
